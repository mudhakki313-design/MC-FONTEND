<div class="madrasa-shell">


  <!-- ================================================= -->
  <!-- MOBILE OVERLAY -->
  <!-- ================================================= -->

  <div
    class="sidebar-overlay"
    [class.show]="sidebarOpen"
    (click)="closeSidebar()">
  </div>


  <!-- ================================================= -->
  <!-- SIDEBAR -->
  <!-- ================================================= -->

  <aside
    class="sidebar"
    [class.open]="sidebarOpen">


    <!-- ================================================= -->
    <!-- BRAND -->
    <!-- ================================================= -->

    <div class="brand">

      <div class="brand-logo">

        <img src="/img/logo.png">

      </div>

      <div class="brand-text">

        <div class="brand-name">
          QMCMS
        </div>

        <div class="brand-subtitle">
          Integrated Madrasa and
          Competition Management System
        </div>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- NAVIGATION -->
    <!-- ================================================= -->

    <nav class="navigation">


      <!-- SECTION -->

      <div class="nav-section-title">
        MADRASA PANEL
      </div>


      <!-- ================================================= -->
      <!-- DASHBOARD -->
      <!-- ================================================= -->

      <a
        routerLink="/madrasa/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        (click)="closeSidebar()">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <rect
              x="3"
              y="3"
              width="7"
              height="7">
            </rect>

            <rect
              x="14"
              y="3"
              width="7"
              height="7">
            </rect>

            <rect
              x="3"
              y="14"
              width="7"
              height="7">
            </rect>

            <rect
              x="14"
              y="14"
              width="7"
              height="7">
            </rect>

          </svg>

        </span>

        <span>
          Dashboard
        </span>

      </a>


      <!-- ================================================= -->
      <!-- MANAGEMENT -->
      <!-- ================================================= -->

      <div class="nav-section-title second">
        MANAGEMENT
      </div>


      <!-- ================================================= -->
      <!-- PARTICIPANTS -->
      <!-- ================================================= -->

      <a
        routerLink="/madrasa/participants"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeSidebar()">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path
              d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2">
            </path>

            <circle
              cx="9"
              cy="7"
              r="4">
            </circle>

            <path
              d="M22 21v-2a4 4 0 0 0-3-3.87">
            </path>

            <path
              d="M16 3.13a4 4 0 0 1 0 7.75">
            </path>

          </svg>

        </span>

        <span>
          Participants
        </span>

      </a>


      <!-- ================================================= -->
      <!-- COMPETITIONS -->
      <!-- ================================================= -->

      <a
        routerLink="/madrasa/competitions"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeSidebar()">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <rect
              x="3"
              y="4"
              width="18"
              height="17"
              rx="2">
            </rect>

            <line
              x1="16"
              y1="2"
              x2="16"
              y2="6">
            </line>

            <line
              x1="8"
              y1="2"
              x2="8"
              y2="6">
            </line>

            <line
              x1="3"
              y1="10"
              x2="21"
              y2="10">
            </line>

          </svg>

        </span>

        <span>
          Competitions
        </span>

      </a>


      <!-- ================================================= -->
      <!-- RESULTS -->
      <!-- ================================================= -->

      <a
        routerLink="/madrasa/results"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeSidebar()">

        <span class="nav-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path
              d="M3 3v18h18">
            </path>

            <path
              d="M7 16l4-5 3 3 5-7">
            </path>

          </svg>

        </span>

        <span>
          Results
        </span>

      </a>


    </nav>


    <!-- ================================================= -->
    <!-- SIDEBAR FOOTER -->
    <!-- ================================================= -->

    <div class="sidebar-footer">


      <!-- USER -->

      <div class="mini-profile">


        <div class="avatar">

          <ng-container
            *ngIf="profileImageUrl; else initialsAvatar">

            <img
              [src]="profileImageUrl"
              alt="Profile">

          </ng-container>


          <ng-template #initialsAvatar>

            {{ initials }}

          </ng-template>

        </div>


        <div class="mini-profile-info">

          <div class="mini-name">
            {{ displayName }}
          </div>

          <div class="mini-role">
            Madrasa
          </div>

        </div>

      </div>


      <!-- LOGOUT -->

      <button
        class="logout-button"
        type="button"
        (click)="logout()">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <path
            d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4">
          </path>

          <polyline
            points="16 17 21 12 16 7">
          </polyline>

          <line
            x1="21"
            y1="12"
            x2="9"
            y2="12">
          </line>

        </svg>

        <span>
          Sign Out
        </span>

      </button>

    </div>


  </aside>


  <!-- ================================================= -->
  <!-- MAIN -->
  <!-- ================================================= -->

  <main class="main-area">


    <!-- ================================================= -->
    <!-- TOPBAR -->
    <!-- ================================================= -->

    <header class="topbar">


      <div class="topbar-left">


        <!-- MOBILE MENU -->

        <button
          class="menu-button"
          type="button"
          (click)="toggleSidebar()">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <line
              x1="3"
              y1="6"
              x2="21"
              y2="6">
            </line>

            <line
              x1="3"
              y1="12"
              x2="21"
              y2="12">
            </line>

            <line
              x1="3"
              y1="18"
              x2="21"
              y2="18">
            </line>

          </svg>

        </button>


        <div class="page-context">

          <span class="page-title">
            Madrasa Administration
          </span>

          <span class="page-subtitle">
            Manage your madrasa activities
          </span>

        </div>

      </div>


      <!-- ================================================= -->
      <!-- TOP RIGHT -->
      <!-- ================================================= -->

      <div class="topbar-right">


        <!-- NOTIFICATION -->

        <button
          class="icon-button"
          type="button"
          aria-label="Notifications">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2">

            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
            </path>

            <path
              d="M13.73 21a2 2 0 0 1-3.46 0">
            </path>

          </svg>

          <span class="notification-dot"></span>

        </button>


        <!-- USER -->

        <div class="top-user">


          <div class="avatar top-avatar">

            <ng-container
              *ngIf="profileImageUrl; else topInitials">

              <img
                [src]="profileImageUrl"
                alt="Profile">

            </ng-container>

            <ng-template #topInitials>

              {{ initials }}

            </ng-template>

          </div>


          <div class="top-user-info">

            <span class="top-user-name">
              {{ displayName }}
            </span>

            <span class="top-user-role">
              Madrasa
            </span>

          </div>

        </div>

      </div>

    </header>


    <!-- ================================================= -->
    <!-- PAGE CONTENT -->
    <!-- ================================================= -->

    <section class="content">

      <router-outlet></router-outlet>

    </section>


  </main>

</div>
